<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração · Kondo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 21V9l6-4v16M9 21V3l12 5v13M3 21h18M13 10h4M13 14h4M13 18h4"/></svg>
      </div>
      <div><b>Kondo</b><small id="condoName">Gestão de condomínios</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Módulos"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main class="main">
    <div class="banner" id="suspBanner" hidden style="border-color:var(--bad);background:var(--bad-soft)"><b>Assinatura suspensa.</b> O portal dos moradores está fechado e só é possível consultar dados. Regularize as faturas em Definições para voltar a fazer alterações.</div>
    <div id="view"></div>
  </main>
</div>
<div id="modalRoot"></div>

<script>
(() => {
const COLS = ['config','moradores','pagamentos','despesas','funcionarios','ocorrencias','manutencao','documentos','cameras','avisos','comunicacoes','utilizadores','pedidos'];
let condo = {estado:'Ativo', plano:'', limite:null};
const D = Object.fromEntries(COLS.map(c => [c, []]));
let me = null, view = 'painel', perfilId = null;
const isAdmin = true;
try { const h = location.hash.slice(1); if (h) view = h; } catch(e) {}

const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_L = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const now = new Date();
const curMes = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
const today = now.toISOString().slice(0,10);
const nf = new Intl.NumberFormat('pt-PT', {maximumFractionDigits:0});
const kz = v => nf.format(Math.round(+v || 0)) + ' Kz';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = s => s ? s.split('-').reverse().join('/') : '—';
const fmtMes = m => { if (!m) return '—'; const [y,mm] = m.split('-'); return MESES[+mm-1] + ' ' + y; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const cfg = () => D.config.find(c => c.id === 'geral') || {nome:'O meu condomínio', diaVencimento:10, inicio: curMes.slice(0,4)+'-01', plano:'Profissional'};
const monthsBetween = (a, b) => { const out = []; let [y,m] = a.split('-').map(Number); const [by,bm] = b.split('-').map(Number); while (y < by || (y === by && m <= bm)) { out.push(y+'-'+String(m).padStart(2,'0')); m++; if (m>12){m=1;y++;} if (out.length>120) break; } return out; };

/* ---------- Schemas ---------- */
const opt = (...a) => a;
const SCHEMA = {
  moradores: { label:'Morador', title:'Moradores', sub:'Diretório de frações e responsáveis. Clique num morador para ver a ficha.',
    fields:[
      ['_s1','Identificação','section'],
      ['nome','Nome completo','text',{req:1,full:1}],['bi','N.º do Bilhete de Identidade','text',{priv:1,ph:'000000000LA000'}],['nif','NIF','text',{priv:1}],
      ['tipo','Tipo','select',opt('Proprietário','Inquilino')],['estado','Estado','select',opt('Ativo','Inativo','Mudou-se')],
      ['_s2','Contactos','section'],
      ['telefone','Telefone','tel',{ph:'+244 9__ ___ ___'}],['email','Email','email',{priv:1}],['emergencia','Contacto de emergência','text',{priv:1,full:1,ph:'Nome e telefone'}],
      ['_s3','Fração','section'],
      ['fracao','Fração','text',{ph:'A-1Esq'}],['bloco','Bloco','text'],['tipologia','Tipologia','select',opt('T1','T2','T3','T4','T5','Loja')],['desde','Paga quotas desde','month'],
      ['_s4','Agregado e viaturas','section'],
      ['agregado','Pessoas no agregado','number'],['viaturas','Matrículas das viaturas','text',{ph:'LD-12-34-AB'}],
      ['foto','Fotografia','file',{full:1,accept:'image/*'}],
      ['observacoes','Observações internas (só administradores)','textarea',{priv:1,full:1}]],
    cols:['fracao','nome','tipo','telefone','estado'], sort:'fracao', filter:'estado' },
  pagamentos: { label:'Pagamento', title:'Pagamentos', sub:'Recibos de quotas recebidas.',
    fields:[['moradorId','Fração','morador',{req:1,full:1}],['mes','Mês de referência','month'],['valor','Valor pago (Kz)','money',{req:1}],['metodo','Método','select',opt('Multicaixa Express','Transferência BAI','Transferência BFA','Transferência BIC','Depósito BIC','Numerário','Outro')],['data','Data do pagamento','date',{req:1}],['referencia','Referência da operação (opcional)','text',{full:1}]],
    cols:['data','moradorId','mes','metodo','referencia','valor'], sort:'-data' },
  despesas: { label:'Despesa', title:'Despesas', sub:'Tudo o que sai da conta do condomínio.',
    fields:[['data','Data','date',{req:1}],['categoria','Categoria','select',opt('Segurança','Energia','Água','Limpeza','Salários','Gerador','Manutenção','Jardinagem','Administrativo','Outro')],['fornecedor','Fornecedor','text'],['valor','Valor (Kz)','money',{req:1}],['descricao','Descrição','text',{full:1}]],
    cols:['data','categoria','fornecedor','descricao','valor'], sort:'-data', filter:'categoria' },
  funcionarios: { label:'Funcionário', title:'Funcionários', sub:'Pessoal do condomínio e respetivos turnos.',
    fields:[['nome','Nome','text',{req:1,full:1}],['funcao','Função','select',opt('Porteiro','Segurança','Auxiliar de limpeza','Jardineiro','Técnico de manutenção','Administrador','Outro')],['turno','Turno','select',opt('Diurno','Noturno','Rotativo')],['telefone','Telefone','tel'],['salario','Salário (Kz)','money'],['admissao','Data de admissão','date'],['estado','Estado','select',opt('Ativo','Férias','Baixa','Inativo')]],
    cols:['nome','funcao','turno','telefone','estado','salario'], sort:'nome' },
  ocorrencias: { label:'Ocorrência', title:'Ocorrências', sub:'Queixas, avarias e incidentes reportados.',
    fields:[['titulo','Título','text',{req:1,full:1}],['fracao','Fração (opcional)','text'],['categoria','Categoria','select',opt('Infraestrutura','Segurança','Convivência','Estacionamento','Limpeza','Outro')],['prioridade','Prioridade','select',opt('Baixa','Média','Alta')],['estado','Estado','select',opt('Aberta','Em curso','Resolvida')],['data','Data','date',{req:1}],['descricao','Descrição','textarea',{full:1}]],
    cols:['data','titulo','fracao','categoria','prioridade','estado'], sort:'-data', filter:'estado' },
  manutencao: { label:'Manutenção', title:'Manutenção', sub:'Plano de manutenção preventiva e reparações.',
    fields:[['equipamento','Equipamento / área','text',{req:1,full:1}],['tipo','Tipo','select',opt('Preventiva','Corretiva','Inspeção')],['estado','Estado','select',opt('Agendada','Em curso','Concluída','Atrasada')],['fornecedor','Fornecedor','text'],['dataPrevista','Data prevista','date'],['custo','Custo estimado (Kz)','money']],
    cols:['dataPrevista','equipamento','tipo','fornecedor','estado','custo'], sort:'dataPrevista', filter:'estado' },
  documentos: { label:'Documento', title:'Documentos', sub:'Actas, regulamentos, contratos e relatórios.',
    fields:[['nome','Nome','text',{req:1,full:1}],['tipo','Tipo','select',opt('Acta','Regulamento','Contrato','Relatório financeiro','Orçamento','Outro')],['data','Data','date'],['visivel','Visível no portal dos moradores','select',opt('Sim','Não')],['ficheiro','Ficheiro (PDF ou imagem)','file',{full:1}],['notas','Notas','textarea',{full:1}]],
    cols:['data','nome','tipo','visivel','ficheiro','notas'], sort:'-data', filter:'tipo' },
  cameras: { label:'Câmara', title:'CCTV', sub:'Estado das câmaras e do gravador.',
    fields:[['nome','Nome','text',{req:1,full:1}],['local','Local','text'],['gravador','Gravador / canal','text'],['estado','Estado','select',opt('Online','Offline','Em manutenção')],['verificacao','Última verificação','date'],['notas','Notas','textarea',{full:1}]],
    sort:'nome', cards:1 },
  avisos: { label:'Aviso', title:'Comunicação', sub:'Avisos e comunicados aos moradores.',
    fields:[['titulo','Título','text',{req:1,full:1}],['mensagem','Mensagem','textarea',{req:1,full:1}],['destinatarios','Destinatários','select',opt('Todos','Proprietários','Inquilinos','Bloco A','Bloco B')],['data','Data','date',{req:1}],['fixado','Fixar no painel','select',opt('Não','Sim')]],
    sort:'-data', cards:1 },
};
const BADGE = {
  estado:{'Aberta':'bad','Em curso':'warn','Resolvida':'ok','Agendada':'info','Concluída':'ok','Atrasada':'bad','Ativo':'ok','Férias':'warn','Baixa':'warn','Inativo':'','Mudou-se':'','Online':'ok','Offline':'bad','Em manutenção':'warn'},
  prioridade:{'Alta':'bad','Média':'warn','Baixa':''},
  tipo:{'Proprietário':'info','Inquilino':''},
  acao:{'Criou':'ok','Alterou':'info','Arquivou':'warn','Eliminou':'bad'},
};

/* ---------- Derived data ---------- */
const moradorById = id => D.moradores.find(m => m.id === id);
const isAtivo = m => !m.estado || m.estado === 'Ativo';
const ativos = () => D.moradores.filter(isAtivo);
const PRIV = SCHEMA.moradores.fields.filter(f => f[3] && f[3].priv).map(f => f[0]);
const withPriv = m => ({...m});
const initials = n => String(n||'?').split(/\s+/).filter(Boolean).map(w => w[0]).filter((c,i,a) => i===0 || i===a.length-1).join('').toUpperCase();
const avatar = (m, size=40) => m.fotoId ? `<img class="av" src="/ficheiros/${esc(m.fotoId)}" alt="" style="width:${size}px;height:${size}px">` : `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px" aria-hidden="true">${esc(initials(m.nome))}</span>`;
const canWrite = col => isAdmin || col === 'ocorrencias';
const fracaoLabel = id => { const m = moradorById(id); return m ? m.fracao + ' · ' + m.nome : '(fração removida)'; };
function paidMap() { const map = {}; for (const p of D.pagamentos) { (map[p.moradorId] ||= {})[p.mes] = p; } return map; }
function dividas() {
  const pm = paidMap(), c = cfg(), dia = +c.diaVencimento || 10;
  const vencido = now.getDate() > dia;
  return ativos().map(m => {
    const start = (m.desde && m.desde > (c.inicio||'')) ? m.desde : (c.inicio || curMes);
    const meses = monthsBetween(start, curMes).filter(mm => !(pm[m.id]||{})[mm]);
    const atraso = meses.filter(mm => mm < curMes || (mm === curMes && vencido));
    const last = D.pagamentos.filter(p => p.moradorId === m.id).sort((a,b) => (b.data||'').localeCompare(a.data||''))[0];
    return {m, meses: atraso, total: atraso.length * quota(), last};
  }).filter(x => x.meses.length).sort((a,b) => b.total - a.total);
}
const quota = () => condo.quotaPadrao || 10000;
// Próximos n meses por pagar da fração, por ordem (não se salta nenhum mês em dívida).
function mesesPorPagar(mid, n) {
  const m = moradorById(mid); if (!m) return [];
  const pm = paidMap()[mid] || {}, c = cfg(), out = [];
  let [y, mo] = ((m.desde && m.desde > (c.inicio||'')) ? m.desde : (c.inicio || curMes)).split('-').map(Number);
  for (let i = 0; out.length < n && i < 600; i++) { const k = y + '-' + String(mo).padStart(2,'0'); if (!pm[k]) out.push(k); if (++mo > 12) { mo = 1; y++; } }
  return out;
}
const sum = (arr, k) => arr.reduce((s, x) => s + (+x[k] || 0), 0);

/* ---------- Icons / nav ---------- */
const I = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const NAV = [
  ['Visão geral'],
  ['painel','Painel', I('<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>')],
  ['Finanças'],
  ['quotas','Quotas', I('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14h2M14 14h2M8 18h2"/>')],
  ['pagamentos','Pagamentos', I('<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/>')],
  ['confirmar','A confirmar', I('<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>'), () => D.comunicacoes.filter(c => c.estado === 'Pendente').length],
  ['relatorios','Relatórios', I('<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>')],
  ['dividas','Dívidas', I('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'), () => dividas().length],
  ['despesas','Despesas', I('<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>')],
  ['Pessoas'],
  ['moradores','Moradores', I('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>')],
  ['funcionarios','Funcionários', I('<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>')],
  ['avisos','Comunicação', I('<path d="M3 11l18-8v18l-18-8zM7 12v5a2 2 0 0 0 4 0v-3"/>')],
  ['Operação'],
  ['ocorrencias','Ocorrências', I('<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>'), () => D.ocorrencias.filter(o => o.estado !== 'Resolvida').length],
  ['manutencao','Manutenção', I('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>')],
  ['cameras','CCTV', I('<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>'), () => D.cameras.filter(c => c.estado !== 'Online').length],
  ['documentos','Documentos', I('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>')],
  ['Administração'],
  ['admin','Gestão de moradores', I('<path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z"/><circle cx="12" cy="10" r="2.5"/><path d="M8 16.5c.8-1.6 2.3-2.5 4-2.5s3.2.9 4 2.5"/>')],
  ['contas','Contas de acesso', I('<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 15v2"/>'), () => D.pedidos.length],
  ['registo','Registo de alterações', I('<path d="M12 8v4l3 2"/><path d="M3.05 11a9 9 0 1 1 .5 4M3 4v5h5"/>')],
  ['Conta'],
  ['definicoes','Definições', I('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>')],
];
function renderNav() {
  document.getElementById('nav').innerHTML = NAV.map(n => {
    if (n.length === 1) return `<div class="nav-group">${n[0]}</div>`;
    const c = n[3] ? n[3]() : 0;
    return `<button type="button" data-go="${n[0]}" ${view===n[0]?'aria-current="page"':''}>${n[2]}<span>${n[1]}</span>${c?`<span class="count">${c}</span>`:''}</button>`;
  }).join('');
  const c = cfg();
  document.getElementById('condoName').textContent = c.nome;
  document.getElementById('sideFoot').innerHTML = `<span style="color:var(--side-ink)">${esc(me ? me.nome : '')}</span><br>${esc(me ? me.email : '')}<br>Plano ${esc(c.plano||'—')} · ${ativos().length} frações<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn small" data-senha style="background:transparent;color:var(--side-ink);border-color:var(--side-active)">Palavra-passe</button><button class="btn small" data-sair style="background:transparent;color:var(--side-ink);border-color:var(--side-active)">Sair</button></div>`;
}
document.getElementById('nav').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
function go(v) { view = v; try { history.replaceState(null, '', '#' + v); } catch(e) {} render(); document.querySelector('.main').scrollIntoView({block:'start'}); }

/* ---------- Render ---------- */
const $view = document.getElementById('view');
const header = (t, s, actions='') => `<div class="top"><div><h1>${t}</h1><p>${s}</p></div><div class="actions">${actions}</div></div>`;
const pill = (field, v) => v ? `<span class="pill ${(BADGE[field]||{})[v] ?? ''}">${esc(v)}</span>` : '<span class="dim">—</span>';
const tableState = {};

function render() {
  renderNav();
  document.getElementById('suspBanner').hidden = condo.estado === 'Ativo';
  const r = ({painel:renderPainel, quotas:renderQuotas, dividas:renderDividas, definicoes:renderDefinicoes, admin:renderAdmin, contas:renderContas, confirmar:renderConfirmar, relatorios:renderRelatorios, registo:renderRegisto, perfil:renderPerfil})[view];
  if (r) r(); else if (SCHEMA[view]) (SCHEMA[view].cards ? renderCards : renderTable)(view); else { view = 'painel'; renderPainel(); }
}

function renderPainel() {
  const c = cfg();
  const esperado = sum(ativos(), 'quota'); const nAt = ativos().length;
  const pagosMes = D.pagamentos.filter(p => p.mes === curMes);
  const recebido = sum(pagosMes, 'valor');
  const taxa = esperado ? Math.round(recebido / esperado * 100) : 0;
  const dv = dividas(); const divTotal = sum(dv, 'total');
  const despMes = sum(D.despesas.filter(d => (d.data||'').startsWith(curMes)), 'valor');
  const saldo = sum(D.pagamentos, 'valor') - sum(D.despesas, 'valor');
  const abertas = D.ocorrencias.filter(o => o.estado !== 'Resolvida');
  const offline = D.cameras.filter(x => x.estado !== 'Online');
  const atrasadas = D.manutencao.filter(x => x.estado === 'Atrasada' || (x.estado === 'Agendada' && x.dataPrevista && x.dataPrevista < today));
  const [y, m] = curMes.split('-').map(Number);
  $view.innerHTML = header(esc(c.nome), `${MESES_L[m-1]} de ${y} · ${D.moradores.length} frações · vencimento ao dia ${c.diaVencimento||10}`,
    `<button class="btn" data-act="novo" data-col="ocorrencias">Nova ocorrência</button>${isAdmin ? '<button class="btn primary" data-act="novo" data-col="pagamentos">Registar pagamento</button>' : ''}`) +
  `<div class="kpis">
    <div class="kpi"><span class="lbl">Quotas de ${MESES[m-1]}</span><span class="val">${kz(recebido)}</span><span class="sub">${taxa}% de ${kz(esperado)} · ${pagosMes.length}/${nAt} frações</span><span class="meter"><i style="width:${Math.min(taxa,100)}%"></i></span></div>
    <div class="kpi ${divTotal?'alert':''}"><span class="lbl">Dívida em atraso</span><span class="val">${kz(divTotal)}</span><span class="sub">${dv.length} frações com quotas por pagar</span></div>
    <div class="kpi"><span class="lbl">Despesas de ${MESES[m-1]}</span><span class="val">${kz(despMes)}</span><span class="sub">${D.despesas.filter(d => (d.data||'').startsWith(curMes)).length} lançamentos</span></div>
    <div class="kpi ${saldo<0?'alert':''}"><span class="lbl">Saldo acumulado</span><span class="val">${kz(saldo)}</span><span class="sub">Receitas menos despesas registadas</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><h2>Receitas e despesas <span class="legend"><span><i style="background:var(--bar-in)"></i>Quotas recebidas</span><span><i style="background:var(--bar-out)"></i>Despesas</span></span></h2>${chart()}</section>
    <section class="panel"><h2>Maiores devedores <small><button class="btn small" data-go2="dividas">Ver todos</button></small></h2>

function chart() {
  const months = []; let [y, m] = curMes.split('-').map(Number);
  for (let i = 5; i >= 0; i--) { let mm = m - i, yy = y; while (mm < 1) { mm += 12; yy--; } months.push(yy + '-' + String(mm).padStart(2,'0')); }
  const inc = months.map(k => sum(D.pagamentos.filter(p => (p.data||'').startsWith(k)), 'valor'));
  const out = months.map(k => sum(D.despesas.filter(p => (p.data||'').startsWith(k)), 'valor'));
  const max = Math.max(1, ...inc, ...out);
  const step = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / step) * step;
  const W = 600, H = 240, L = 58, B = 26, T = 10, ch = H - B - T, gw = (W - L - 8) / 6, bw = Math.min(26, gw / 3);
  const yv = v => T + ch - v / top * ch;
  const short = v => v >= 1e6 ? (v/1e6).toLocaleString('pt-PT',{maximumFractionDigits:1}) + ' M' : v >= 1e3 ? Math.round(v/1e3) + ' mil' : v;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = top * i / 4, yy = yv(v); g += `<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${short(v)}</text>`; }
  months.forEach((k, i) => {
    const cx = L + gw * i + gw / 2;
    g += `<rect x="${cx-bw-2}" y="${yv(inc[i])}" width="${bw}" height="${ch - (yv(inc[i]) - T)}" rx="3" fill="var(--bar-in)"><title>Quotas ${fmtMes(k)}: ${kz(inc[i])}</title></rect>`;
    g += `<rect x="${cx+2}" y="${yv(out[i])}" width="${bw}" height="${ch - (yv(out[i]) - T)}" rx="3" fill="var(--bar-out)"><title>Despesas ${fmtMes(k)}: ${kz(out[i])}</title></rect>`;
    g += `<text x="${cx}" y="${H-8}" text-anchor="middle" ${k===curMes?'style="fill:var(--ink);font-weight:600"':''}>${MESES[+k.slice(5)-1]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Quotas recebidas e despesas nos últimos 6 meses">${g}</svg>`;
}

function sortRows(rows, s) { if (!s) return rows; const d = s[0]==='-' ? -1 : 1, k = s.replace('-',''); return [...rows].sort((a,b) => String(a[k]??'').localeCompare(String(b[k]??''), 'pt', {numeric:true}) * d); }
function cellFor(col, f, r) {
  const v = r[f[0]], t = f[2];
  if (f[0] === 'moradorId') return esc(fracaoLabel(v));
  if (t === 'money') return nf.format(+v || 0);
  if (t === 'date') return `<span class="dim">${fmtDate(v)}</span>`;
  if (t === 'month') return fmtMes(v);
  if (t === 'file') return r.ficheiroId ? `<a href="/ficheiros/${esc(r.ficheiroId)}" target="_blank" rel="noopener" data-stop>${esc(r.ficheiroNome || 'Abrir')}</a>` : '<span class="dim">—</span>';
  if (BADGE[f[0]]) return pill(f[0], v);
  if (f[0] === 'notas' || f[0] === 'descricao') return `<span class="dim">${esc(v || '')}</span>`;
  return esc(v) || '<span class="dim">—</span>';
}
function renderTable(col) {

  $view.innerHTML = header(S.title, S.sub, addBtn(col)) +
    `<div class="toolbar"><input class="search" id="q-${col}" type="search" placeholder="Pesquisar…" value="${esc(st.q)}" aria-label="Pesquisar">${filt}<span class="dim" style="font-size:13px">${rows.length} registo${rows.length===1?'':'s'}${moneyCol ? ' · total ' + kz(sum(rows, moneyCol)) : ''}</span><button class="btn small" id="csv-${col}" style="margin-left:auto">Exportar CSV</button></div>

  const fl = document.getElementById('flt-' + col); if (fl) fl.addEventListener('change', () => { st.f = fl.value; renderTable(col); });

}

/* ---------- Exportar CSV (abre no Excel com separador ;) ---------- */
function exportCsv(nome, fields, rows) {
  const cell = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const val = (f, r) => f[0] === 'moradorId' ? fracaoLabel(r[f[0]]) : r[f[0]];
  const lines = [fields.map(f => cell(f[1])).join(';'), ...rows.map(r => fields.map(f => cell(val(f, r))).join(';'))];
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `kondo-${nome}-${today}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`${rows.length} registos exportados`);
}

/* ---------- Importar moradores de Excel / CSV ---------- */
async function lerXlsx(buf) {
  if (typeof DecompressionStream === 'undefined') throw new Error('Este browser não consegue ler ficheiros Excel. Guarde a folha como CSV ou use um browser mais recente.');
  const u8 = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder();
  let e = u8.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('Ficheiro Excel inválido.');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const files = {};
  for (let i = 0; i < n; i++) {
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    files[dec.decode(u8.subarray(p + 46, p + 46 + nl))] = {method: dv.getUint16(p + 10, true), csize: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true)};
    p += 46 + nl + el + cl;
  }
  const read = async name => {
    const f = files[name]; if (!f) return null;
    const st = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true), data = u8.subarray(st, st + f.csize);
    if (f.method === 0) return dec.decode(data);
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
  const xml = t => new DOMParser().parseFromString(t, 'application/xml');
  const sheetName = Object.keys(files).filter(k => /^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a, b) => a.localeCompare(b, 'en', {numeric: true}))[0];
  if (!sheetName) throw new Error('Não foi encontrada nenhuma folha no ficheiro.');
  const ss = await read('xl/sharedStrings.xml');
  const strings = ss ? [...xml(ss).getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t => t.textContent).join('')) : [];
  const rows = [];
  for (const row of xml(await read(sheetName)).getElementsByTagName('row')) {
    const arr = [];
    for (const c of row.getElementsByTagName('c')) {
      const col = [...(c.getAttribute('r') || '').replace(/\d+/g, '')].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
      const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
      let val = '';
      if (t === 'inlineStr') val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
      else if (v) val = t === 's' ? (strings[+v.textContent] || '') : v.textContent;
      if (col >= 0) arr[col] = String(val).trim();
    }
    rows.push(Array.from(arr, x => x || ''));
  }
  return rows;
}
function lerCsv(texto) {
  const sep = (texto.split('\n')[0].match(/;/g) || []).length > (texto.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (q) { if (ch === '"') { if (texto[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur.trim()); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && texto[i + 1] === '\n') i++; row.push(cur.trim()); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur.trim()); rows.push(row); }
  return rows;
}
// Reconhece o cabeçalho (nome, fração, bloco, telefone, email, tipo). Sem cabeçalho, a 1.ª coluna é o nome.
function linhasDeMoradores(rows) {

  const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, '');
  const mapa = {nome:['nome','nomecompleto','morador','moradores','proprietario','condomino','name'], fracao:['fracao','fraccao','apartamento','andar','casa','porta','unidade'], bloco:['bloco','edificio','predio'], telefone:['telefone','tel','telemovel','telemovel1','contacto','celular','whatsapp','telef'], email:['email','correio','mail'], tipo:['tipo']};
  const cab = rows[0].map(norm), idx = {};
  for (const [k, nomes] of Object.entries(mapa)) { const i = cab.findIndex(c => nomes.includes(c)); if (i >= 0) idx[k] = i; }
  const temCab = idx.nome !== undefined;
  if (!temCab) idx.nome = 0;
  return (temCab ? rows.slice(1) : rows).map(r => Object.fromEntries(Object.entries(idx).map(([k, i]) => [k, r[i] || ''])));
}
function importarMoradores() {
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><header><h2 id="mt">Importar moradores de Excel</h2><button class="x" type="button" data-close aria-label="Fechar">✕</button></header>
    <form onsubmit="return false"><p class="field full" style="margin:0;font-size:14px">Escolha um ficheiro <b>.xlsx</b> ou <b>.csv</b>. A 1.ª linha pode ter os títulos <b>Nome</b>, Fração, Bloco, Telefone, Email e Tipo — só o nome é obrigatório. Sem títulos, a 1.ª coluna é lida como nome. Cada morador fica com a quota mensal de ${kz(quota())}.</p>
    <div class="field full"><label for="impF">Ficheiro</label><input id="impF" type="file" accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div>
    <div class="field full" id="impPrev"></div><p class="dim field full" id="mErr" style="color:var(--bad);margin:0" hidden></p>
    <footer><span></span><div><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="button" id="impGo" disabled>Importar</button></div></footer></form></div></div>`;
  let linhas = [];
  const err = m => { const e2 = document.getElementById('mErr'); e2.hidden = !m; e2.textContent = m || ''; };
  document.getElementById('impF').addEventListener('change', async e => {
    const f = e.target.files[0]; err(''); linhas = []; document.getElementById('impGo').disabled = true; document.getElementById('impPrev').innerHTML = '';
    if (!f) return;
    try {
      const rows = /\.xlsx$/i.test(f.name) ? await lerXlsx(await f.arrayBuffer()) : lerCsv((await f.text()).replace(/^﻿/, ''));
      linhas = linhasDeMoradores(rows).filter(l => l.nome);
      if (!linhas.length) throw new Error('Não foram encontrados nomes no ficheiro.');
      document.getElementById('impPrev').innerHTML = `<b>${linhas.length}</b> morador${linhas.length === 1 ? '' : 'es'} encontrado${linhas.length === 1 ? '' : 's'}. Pré-visualização:<div class="tablewrap" style="margin-top:6px"><table><thead><tr><th>Nome</th><th>Fração</th><th>Telefone</th></tr></thead><tbody>${linhas.slice(0, 8).map(l => `<tr><td>${esc(l.nome)}</td><td>${esc(l.fracao || '—')}</td><td>${esc(l.telefone || '—')}</td></tr>`).join('')}</tbody></table></div>${linhas.length > 8 ? `<span class="dim">… e mais ${linhas.length - 8}</span>` : ''}`;
      document.getElementById('impGo').disabled = false;
    } catch (ex) { err(ex.message || 'Não foi possível ler o ficheiro.'); }
  });
  document.getElementById('impGo').addEventListener('click', async e => {
    e.target.disabled = true; e.target.textContent = 'A importar…'; err('');
    try {
      const j = await api('POST', '/api/admin/moradores/importar', {linhas});
      await loadAll(); closeModal(); render();
      toast(`${j.importados} morador${j.importados === 1 ? '' : 'es'} importado${j.importados === 1 ? '' : 's'}` + (j.ignorados.length ? ` · ${j.ignorados.length} ignorado${j.ignorados.length === 1 ? '' : 's'} (${j.ignorados.slice(0, 2).map(x => 'linha ' + x.linha + ': ' + x.motivo).join('; ')}${j.ignorados.length > 2 ? '…' : ''})` : ''));
    } catch (ex) { err(errMsg(ex)); e.target.disabled = false; e.target.textContent = 'Importar'; }
  });
}

/* ---------- Global clicks ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) return;
  const t = e.target.closest('[data-act],[data-edit],[data-pay],[data-go2],[data-cobrar],[data-plano],[data-perfil],[data-del],[data-acesso],[data-repor],[data-ativo],[data-delconta],[data-novoadmin],[data-senha],[data-sair],[data-confirmar],[data-rejeitar],[data-importar]'); if (!t) return;
  if ('importar' in t.dataset) { importarMoradores(); return; }
  if (t.dataset.perfil) { perfilId = t.dataset.perfil; go('perfil'); return; }
  if (t.dataset.del) { openDeleteMorador(t.dataset.del); return; }
  if (t.dataset.acesso) { criarAcesso(t.dataset.acesso); return; }
  if (t.dataset.repor) { contaAcao('repor', t.dataset.repor); return; }
  if (t.dataset.ativo) { contaAcao('ativo', t.dataset.ativo); return; }
  if (t.dataset.delconta) { removerConta(t.dataset.delconta); return; }
  if ('novoadmin' in t.dataset) { novoAdmin(); return; }
  if ('senha' in t.dataset) { alterarSenha(); return; }
  if ('sair' in t.dataset) { sair(); return; }
  if (t.dataset.confirmar) { confirmarCom(t.dataset.confirmar); return; }
  if (t.dataset.rejeitar) { rejeitarCom(t.dataset.rejeitar); return; }
  if (t.dataset.act === 'novo') { const m = t.dataset.mid && moradorById(t.dataset.mid); openForm(t.dataset.col, null, m ? {moradorId:m.id, valor:quota()} : null); }
  else if (t.dataset.edit) { const [col, id] = t.dataset.edit.split(':'); const r = D[col].find(x => x.id === id); if (r) openForm(col, r); }
  else if (t.dataset.pay) { const [mid, mes] = t.dataset.pay.split('|'); const ate = mesesPorPagar(mid, 600).filter(x => x <= mes).length || 1; openForm('pagamentos', null, {moradorId:mid, valor:ate * quota()}); }
  else if (t.dataset.go2) go(t.dataset.go2);
  else if (t.dataset.cobrar) cobranca(t.dataset.cobrar);
  else if (t.dataset.plano) mudarPlano(t.dataset.plano);
});

let toastT;
function toast(msg) { let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); } el.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2600); }

/* ---------- Data layer (servidor Kondo) ---------- */
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = '/login'; throw new Error('A sua sessão terminou. Entre de novo.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || 'Não foi possível contactar o servidor. Verifique a ligação.');
  return j;
}
async function save(col, obj) {
  const clean = JSON.parse(JSON.stringify(obj));
  const j = await api('PUT', `/api/admin/reg/${col}/${encodeURIComponent(clean.id)}`, clean);
  const i = D[col].findIndex(x => x.id === clean.id); if (i >= 0) D[col][i] = j.registo; else D[col].push(j.registo);
  if (col === 'moradores') D.utilizadores.forEach(u => { if (u.morador_id === clean.id) u.nome = clean.nome; });
  render();
}
async function remove(col, id) {
  await api('DELETE', `/api/admin/reg/${col}/${encodeURIComponent(id)}`);
  D[col] = D[col].filter(x => x.id !== id);
  if (col === 'moradores') D.utilizadores = D.utilizadores.filter(u => u.morador_id !== id);
  render();
}
const assets = {
  upload: file => new Promise((resolve, reject) => {
    if (file.size > 5e6) return reject(new Error('O ficheiro deve ter até 5 MB.'));
    const fr = new FileReader();
    fr.onload = () => api('POST', '/api/admin/ficheiros', { nome: file.name, tipo: file.type, base64: String(fr.result).split(',')[1] }).then(resolve, reject);
    fr.onerror = () => reject(new Error('Não foi possível ler o ficheiro.'));
    fr.readAsDataURL(file);
  }),
};
async function loadAll() {
  const j = await api('GET', '/api/admin/dados');
  for (const c of COLS) D[c] = j[c] || [];
  me = j.eu; condo = j.condominio || condo;
}
async function boot() {
  try { await loadAll(); } catch (e) { $view.innerHTML = `<div class="panel"><p class="empty">${esc(e.message)}</p></div>`; return; }
  const aviso = sessionStorage.getItem('kondo_aviso'); if (aviso) { sessionStorage.removeItem('kondo_aviso'); setTimeout(() => toast(aviso), 300); }
  render();
}
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== view) { view = v; render(); } });
boot();
})();
</script>

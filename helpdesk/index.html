<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediaNova | Helpdesk de TI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <div class="logo-mark">M</div>
    <div><strong>media<span>nova</span></strong><small>Helpdesk de TI</small></div>
  </div>
  <nav>
    <button class="nav-btn active" data-view="dashboard">📊 Painel</button>
    <button class="nav-btn" data-view="tickets">🎫 Chamados</button>
    <button class="nav-btn" data-view="new">➕ Novo chamado</button>
  </nav>
  <div class="sidebar-foot">
    <button class="btn ghost" id="exportBtn">⬇ Exportar CSV</button>
    <button class="btn ghost" id="resetBtn">↺ Dados de exemplo</button>
  </div>
</aside>

<main>
  <header class="topbar">
    <h1 id="viewTitle">Painel</h1>
    <input type="search" id="globalSearch" placeholder="Buscar chamado, solicitante, #ID…">
  </header>

  <!-- Painel -->
  <section id="view-dashboard" class="view">
    <div class="cards" id="statCards"></div>
    <div class="grid2">
      <div class="panel"><h3>Por prioridade</h3><div id="chartPrio"></div></div>
      <div class="panel"><h3>Por categoria</h3><div id="chartCat"></div></div>
    </div>
    <div class="panel"><h3>Últimos chamados</h3><div id="recent"></div></div>
  </section>

  <!-- Lista -->
  <section id="view-tickets" class="view hidden">
    <div class="filters">
      <select id="fStatus"><option value="">Todos os status</option></select>
      <select id="fPrio"><option value="">Todas as prioridades</option></select>
      <select id="fCat"><option value="">Todas as categorias</option></select>
      <select id="fTech"><option value="">Todos os técnicos</option></select>
    </div>
    <div class="panel table-wrap">
      <table>
        <thead><tr><th>#</th><th>Assunto</th><th>Solicitante</th><th>Categoria</th><th>Prioridade</th><th>Status</th><th>Técnico</th><th>Abertura</th></tr></thead>
        <tbody id="ticketRows"></tbody>
      </table>
      <p class="empty hidden" id="emptyMsg">Nenhum chamado encontrado.</p>
    </div>
  </section>

  <!-- Novo -->
  <section id="view-new" class="view hidden">
    <form id="ticketForm" class="panel form">
      <div class="row">
        <label>Solicitante*<input name="requester" required></label>
        <label>E-mail<input name="email" type="email"></label>
        <label>Departamento<input name="dept"></label>
      </div>
      <div class="row">
        <label>Categoria*<select name="category" required></select></label>
        <label>Prioridade*<select name="priority" required></select></label>
        <label>Técnico responsável<select name="tech"></select></label>
      </div>
      <label>Assunto*<input name="title" required maxlength="120"></label>
      <label>Descrição*<textarea name="description" rows="6" required></textarea></label>
      <div class="actions"><button class="btn primary" type="submit">Abrir chamado</button></div>
    </form>
  </section>
</main>

<!-- Detalhe -->
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <button class="close" id="closeModal" aria-label="Fechar">×</button>
    <div id="detail"></div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>
<script src="app.js"></script>
</body>
</html>

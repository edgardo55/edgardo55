<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helpdesk de TI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login -->
<div id="loginScreen" class="login hidden">
  <form id="loginForm" class="login-box">
    <div class="login-brand"><img id="loginLogo" class="logo-img" src="/logo.png" alt="MediaNova"><div id="loginMark" class="logo-mark hidden">M</div></div>
    <h1>Central de Chamados</h1>
    <p class="login-sub">Helpdesk de TI</p>
    <label>E-mail<input name="email" type="email" required autocomplete="username" autofocus></label>
    <label>Senha<input name="password" type="password" required autocomplete="current-password"></label>
    <p class="form-error" id="loginError"></p>
    <button class="btn primary block" type="submit">Entrar</button>
    <button class="btn link hidden" type="button" id="showRegister">Criar conta de solicitante</button>
  </form>
</div>

<!-- Aplicação -->
<div id="appShell" class="shell hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo-card"><img id="sideLogo" class="logo-img" src="/logo.png" alt="MediaNova"><div id="sideMark" class="logo-mark hidden">M</div></div>
      <small>Helpdesk de TI</small>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="whoami"><b id="meName"></b><small id="meRole"></small></div>
      <button class="btn ghost" id="pwBtn">🔑 Alterar senha</button>
      <button class="btn ghost" id="logoutBtn">⎋ Sair</button>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1 id="viewTitle"></h1>
      <div class="top-actions">
        <input type="search" id="globalSearch" placeholder="Buscar chamados…">
        <div class="bell-wrap">
          <button class="bell" id="bell" aria-label="Notificações">🔔<span id="bellCount" class="badge hidden">0</span></button>
          <div class="dropdown hidden" id="bellMenu"></div>
        </div>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>

<div class="modal hidden" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toast hidden" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
